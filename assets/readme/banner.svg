<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">flutter_demo — Hola Mundo en Flutter</title>
  <desc id="d">De una línea de Dart a un APK instalado: código, compilación y despliegue, animados como una línea de ensamblaje. A la derecha, un teléfono que saluda en varios idiomas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1826"/><stop offset="1" stop-color="#18263D"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E5AA8"/><stop offset="1" stop-color="#54ACFF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#54ACFF" stroke-opacity="0.06" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="48 0" dur="9s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="screen"><rect x="958" y="72" width="164" height="232" rx="6"/></clipPath>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="340" fill="url(#steel)"/>

  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">
    <text x="60" y="74" font-size="14" fill="#54ACFF" letter-spacing="4">DART  ·  FLUTTER  ·  ANDROID</text>
  </g>
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="60" y="134" font-size="50" font-weight="700" fill="#F0F4FA">flutter_demo</text>
    <text x="60" y="170" font-size="21" fill="#C9D3E1">Hola Mundo en Flutter</text>
    <text x="60" y="200" font-size="15" fill="#8A97AA">De una línea de Dart a un APK instalado — demo de la exposición</text>
  </g>

  <!-- línea de ensamblaje: un pulso viaja Código -> Compilar -> Desplegar -->
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">
    <line x1="140" y1="272" x2="760" y2="272" stroke="#2A3A55" stroke-width="3"/>
    <circle cy="272" r="7" fill="#F0F4FA">
      <animate attributeName="cx" values="140;450;760;760" keyTimes="0;0.5;1;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;1;0;0" keyTimes="0;0.47;0.5;0.53;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <rect x="140" y="269" width="0" height="6" fill="url(#shine)">
      <animate attributeName="width" values="0;620;620;0;0" keyTimes="0;0.5;0.53;0.56;1" dur="6s" repeatCount="indefinite"/>
    </rect>

    <circle cx="140" cy="272" r="24" fill="#0F1826" stroke="#2A3A55" stroke-width="2"/>
    <circle cx="140" cy="272" r="24" fill="none" stroke="url(#steel)" stroke-width="3" opacity="0.25">
      <animate attributeName="opacity" values="0.25;1;0.4;0.25" keyTimes="0;0.02;0.18;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="140" y="278" text-anchor="middle" font-size="13" fill="#54ACFF" font-weight="700">1</text>
    <text x="140" y="318" text-anchor="middle" font-size="12" fill="#8A97AA" letter-spacing="1">CÓDIGO</text>

    <circle cx="450" cy="272" r="24" fill="#0F1826" stroke="#2A3A55" stroke-width="2"/>
    <circle cx="450" cy="272" r="24" fill="none" stroke="url(#steel)" stroke-width="3" opacity="0.25">
      <animate attributeName="opacity" values="0.25;0.25;1;0.4;0.25" keyTimes="0;0.33;0.35;0.51;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="450" y="278" text-anchor="middle" font-size="13" fill="#54ACFF" font-weight="700">2</text>
    <text x="450" y="318" text-anchor="middle" font-size="12" fill="#8A97AA" letter-spacing="1">COMPILAR</text>

    <circle cx="760" cy="272" r="24" fill="#0F1826" stroke="#2A3A55" stroke-width="2"/>
    <circle cx="760" cy="272" r="24" fill="none" stroke="url(#steel)" stroke-width="3" opacity="0.25">
      <animate attributeName="opacity" values="0.25;0.25;1;0.4;0.25" keyTimes="0;0.65;0.67;0.84;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="760" y="278" text-anchor="middle" font-size="13" fill="#54ACFF" font-weight="700">3</text>
    <text x="760" y="318" text-anchor="middle" font-size="12" fill="#8A97AA" letter-spacing="1">DESPLEGAR</text>
  </g>

  <!-- teléfono: el saludo cambia de idioma, como el botón de la app -->
  <rect x="946" y="40" width="188" height="290" rx="24" fill="#0B121D" stroke="#2A3A55" stroke-width="2"/>
  <rect x="1010" y="52" width="60" height="6" rx="3" fill="#2A3A55"/>
  <g clip-path="url(#screen)">
    <rect x="958" y="72" width="164" height="232" fill="#F0F4FA"/>
    <rect x="958" y="72" width="164" height="34" fill="#D6E3F7"/>
    <text x="970" y="94" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0F1826">Hola Mundo · Flutter</text>
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F1826" text-anchor="middle">
      <text x="1040" y="190" opacity="0">¡Hola, Mundo!
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.22;0.25;0.97;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="1040" y="190" opacity="0">Hello, World!
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.27;0.47;0.5;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="1040" y="190" opacity="0">Olá, Mundo!
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.52;0.72;0.75;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="1040" y="190" opacity="0">Bonjour !
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.74;0.77;0.97;1" dur="8s" repeatCount="indefinite"/>
      </text>
    </g>
    <rect x="1000" y="140" width="80" height="4" rx="2" fill="#1E5AA8" opacity="0.5"/>
    <text x="1040" y="214" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#4A5568">Saludos enviados</text>
    <rect x="1060" y="262" width="52" height="30" rx="10" fill="#1E5AA8">
      <animate attributeName="opacity" values="1;1;0.55;1;1" keyTimes="0;0.2;0.23;0.26;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="1086" y="281" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#F0F4FA">Saludar</text>
  </g>

  <circle cx="900" cy="74" r="5" fill="#3FB950"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="886" y="79" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#8A97AA" text-anchor="end">hot reload</text>
</svg>
